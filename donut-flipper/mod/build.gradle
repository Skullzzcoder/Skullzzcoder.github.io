plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // The analysis engine, bundled into the mod jar so it ships as one file.
    // Gson is excluded because Minecraft already provides it -- shipping a second
    // copy risks a classloader conflict at runtime for no benefit.
    implementation project(':core')
    include project(':core')

    implementation('org.xerial:sqlite-jdbc:3.53.2.1')
    include('org.xerial:sqlite-jdbc:3.53.2.1')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

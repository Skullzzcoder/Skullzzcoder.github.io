plugins {
    // Newest stable Loom. Older Loom (1.11) fails during Minecraft setup against a recent
    // Fabric API with "Javadoc provided by mod (...) must be have an intermediary source
    // namespace"; a dynamic range picks up 1.18.0-alpha builds, which we do not want.
    // This Loom declares org.gradle.plugin.api-version 9.5.0, so the wrapper must be
    // Gradle 9.5 or newer -- see gradle/wrapper/gradle-wrapper.properties.
    id 'fabric-loom' version '1.17.20'
    id 'maven-publish'
}

// The toolchain for one Minecraft version. Pick it with -Ptarget=<version>, which reads
// versions/<version>.properties; with no target the values in gradle.properties are used,
// so an existing checkout keeps building exactly as it did.
//
// One jar per Minecraft version, always. A Fabric mod is compiled against remapped
// Minecraft names and those names move between releases, so a jar built for one will not
// load on another -- there is no set of properties that makes a single jar span two.
def target = project.findProperty('target')
def targetProps = [:]

if (target != null) {
    def file = file("versions/${target}.properties")
    if (!file.exists()) {
        def known = fileTree('versions').matching { include '*.properties' }
                .files.collect { it.name.replace('.properties', '') }.sort()
        throw new GradleException(
                "No versions/${target}.properties.\n\n" +
                "Known targets: ${known.isEmpty() ? '(none)' : known.join(', ')}\n\n" +
                "Make one for Minecraft ${target} with:\n" +
                "    powershell -ExecutionPolicy Bypass -File fabric-versions.ps1 " +
                "-MinecraftVersion ${target} -Write")
    }
    def loaded = new Properties()
    file.withInputStream { loaded.load(it) }
    loaded.each { key, value -> targetProps[key.toString()] = value.toString() }
    logger.lifecycle("Mirage: building for Minecraft ${target}")
}

// Read defensively so a missing value names itself instead of surfacing as Gradle's
// "unknown property".
def versionProps = ['minecraft_version', 'yarn_mappings', 'loader_version', 'fabric_version']
def prop = { String name ->
    targetProps.containsKey(name) ? targetProps[name] : (project.findProperty(name) ?: 'MISSING')
}

def missing = versionProps.findAll { prop(it) == 'MISSING' }
if (!missing.isEmpty()) {
    throw new GradleException(
            (target == null ? "gradle.properties" : "versions/${target}.properties")
            + " is missing: ${missing.join(', ')}\n\n" +
            "Get the correct values for your Minecraft version with:\n" +
            "    powershell -ExecutionPolicy Bypass -File fabric-versions.ps1 " +
            "-MinecraftVersion <version> -Write\n" +
            "or by hand from https://fabricmc.net/develop/")
}

// What the jar tells Fabric it runs on. Defaults to exactly the version it was built
// against, because that is the only version its compiled names are known to match.
def minecraftDepend = targetProps.containsKey('minecraft_depend')
        ? targetProps['minecraft_depend']
        : (project.findProperty('minecraft_depend') ?: "~${prop('minecraft_version')}")

version = project.findProperty('mod_version') ?: '1.0.0'
group = project.findProperty('maven_group') ?: 'dev.skullzz'

base {
    // The Minecraft version is part of the name: two targets otherwise write the same
    // file, and the second silently replaces the first in build/libs.
    def stem = project.findProperty('archives_base_name') ?: 'mirage'
    archivesName = target == null ? stem : "${stem}-mc${prop('minecraft_version')}"
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${prop('minecraft_version')}"
    mappings "net.fabricmc:yarn:${prop('yarn_mappings')}:v2"
    modImplementation "net.fabricmc:fabric-loader:${prop('loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${prop('fabric_version')}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_depend", minecraftDepend

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_depend": minecraftDepend
    }
}

// Compile target. 21 keeps the jar loadable on any Java 21+ server; raise it only if
// compilation complains that Minecraft's class files are a newer version than this.
def javaVersion = Integer.parseInt((project.findProperty('java_version') ?: '21').toString())

// options.release alone pins both source and target, and unlike the java extension's
// sourceCompatibility/targetCompatibility it is not deprecated under Gradle 9.
tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.compilerArgs << '-Xlint:deprecation'
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

/**
 * Prints the real members of the Minecraft classes this mod leans on, read straight off the
 * remapped compile classpath. Run this when a "cannot find symbol" error means a yarn name
 * moved between versions: gradlew inspectApi
 */
/**
 * The four things the keys screen needs and nothing else.
 *
 * <p>inspectApi prints everything, which is right when you do not know where to look and
 * wrong when you do: the answer here is four class listings and the rest is a haystack.
 * Writes a file as well as printing, so the output does not depend on redirecting a shell
 * that Minecraft's logger is also writing to.
 */
tasks.register('inspectKeys') {
    group = 'help'
    description = 'Prints only what the keys screen needs: KeyBinding, GameOptions, and the input events.'
    notCompatibleWithConfigurationCache('Loads classes from the compile classpath.')

    def compileClasspath = sourceSets.main.compileClasspath
    def report = layout.buildDirectory.file('mirage-keys-api.txt')

    doLast {
        // Minecraft's logger starts up as soon as one of its classes is touched and wants
        // this directory. Without it the console fills with stack traces that look like a
        // failure and are not.
        new File(projectDir, 'logs').mkdirs()

        def urls = compileClasspath.files.collect { it.toURI().toURL() }
        def loader = new URLClassLoader(urls as URL[], (ClassLoader) null)
        def out = new StringBuilder()

        def say = { String line -> out.append(line).append('\n') }

        def list = { String className, List filters ->
            say('')
            say("== ${className}")
            try {
                def type = loader.loadClass(className)
                def lines = [] as TreeSet

                type.methods.each { method ->
                    try {
                        if (method.declaringClass == Object.class) return
                        if (!filters.isEmpty()
                                && !filters.any { method.name.toLowerCase().contains(it) }) return
                        def params = method.parameterTypes.collect { it.simpleName }.join(', ')
                        lines << "  ${method.returnType.simpleName} ${method.name}(${params})"
                    } catch (Throwable ignored) {
                    }
                }
                type.fields.each { field ->
                    try {
                        if (!filters.isEmpty()
                                && !filters.any { field.name.toLowerCase().contains(it) }) return
                        lines << "  [field] ${field.type.simpleName} ${field.name}"
                    } catch (Throwable ignored) {
                    }
                }
                type.constructors.each { ctor ->
                    try {
                        def params = ctor.parameterTypes.collect { it.simpleName }.join(', ')
                        lines << "  [ctor] ${type.simpleName}(${params})"
                    } catch (Throwable ignored) {
                    }
                }
                lines.each { say(it) }
                if (lines.isEmpty()) say('  <nothing matched>')
                return type
            } catch (Throwable failure) {
                say("  <could not load: ${failure}>")
                return null
            }
        }

        list('net.minecraft.client.option.KeyBinding', [])
        list('net.minecraft.client.option.GameOptions', ['key', 'bind', 'write', 'save'])
        list('net.minecraft.client.util.InputUtil', ['key', 'code', 'unknown'])

        // Whatever a key press and a click now arrive as. Named from the signatures rather
        // than guessed at, then listed whole.
        def screen = list('net.minecraft.client.gui.screen.Screen', ['key', 'mouse', 'click'])
        if (screen != null) {
            def seen = [] as Set
            ['keyPressed', 'mouseClicked'].each { name ->
                screen.methods.findAll { it.name == name }.each { method ->
                    method.parameterTypes.each { param ->
                        if (!param.isPrimitive() && seen.add(param.name)) list(param.name, [])
                    }
                }
            }
        }

        println out.toString()
        def file = report.get().asFile
        file.parentFile.mkdirs()
        file.text = out.toString()
        println ""
        println "Written to ${file}"
    }
}

tasks.register('inspectApi') {
    group = 'help'
    description = 'Prints members of the Minecraft classes this mod depends on.'
    notCompatibleWithConfigurationCache('Loads classes from the compile classpath.')

    def compileClasspath = sourceSets.main.compileClasspath

    doLast {
        // Minecraft's logger starts up as soon as one of its classes is touched and wants
        // this directory. Without it the console fills with stack traces that look like a
        // failure and are not.
        new File(projectDir, 'logs').mkdirs()

        def urls = compileClasspath.files.collect { it.toURI().toURL() }
        def loader = new URLClassLoader(urls as URL[], (ClassLoader) null)

        // Printing a member resolves the classes in its signature, and some Minecraft
        // classes fail JVM verification when loaded outside the game. So keep filters
        // narrow, and let a single unprintable member be skipped rather than aborting.
        def dump
        dump = { Class type, List filters, String note ->
          // Blanket guard: reading any member can trigger loading a class that fails
          // verification, and this is a diagnostic tool -- it must never fail the build.
          try {
            println ""
            println "== ${type.name}${note}"
            def lines = [] as TreeSet
            def skipped = 0

            try {
                type.methods.each { method ->
                    try {
                        if (method.declaringClass == Object.class) return
                        if (filters.isEmpty() || filters.any { method.name.toLowerCase().contains(it) }) {
                            def params = method.parameterTypes.collect { it.simpleName }.join(', ')
                            lines << "  ${method.returnType.simpleName} ${method.name}(${params})"
                        }
                    } catch (Throwable ignored) {
                        skipped++
                    }
                }
                type.fields.each { field ->
                    try {
                        if (filters.isEmpty() || filters.any { field.name.toLowerCase().contains(it) }) {
                            lines << "  [field] ${field.type.simpleName} ${field.name}"
                        }
                    } catch (Throwable ignored) {
                        skipped++
                    }
                }
                // Constructors have no name to filter on, so only list them on a full dump.
                if (filters.isEmpty()) {
                    type.constructors.each { constructor ->
                        try {
                            def params = constructor.parameterTypes.collect { it.simpleName }.join(', ')
                            lines << "  [ctor] ${type.simpleName}(${params})"
                        } catch (Throwable ignored) {
                            skipped++
                        }
                    }
                }
            } catch (Throwable failure) {
                println "  <member listing failed: ${failure}>"
            }

            if (lines.isEmpty()) {
                println "  <nothing matched the filters ${filters}>"
            } else {
                lines.each { println it }
            }
            if (skipped > 0) println "  (${skipped} member(s) skipped: signature classes would not load)"
          } catch (Throwable failure) {
            println "  <could not inspect ${type}: ${failure}>"
          }
        }

        def load = { String name ->
            try {
                return loader.loadClass(name)
            } catch (Throwable failure) {
                println ""
                println "== ${name}"
                println "  <could not load: ${failure}>"
                return null
            }
        }

        // Dump whatever types a method mentions, so an unfamiliar API can be explored
        // without having to know which package its classes live in.
        def follow
        follow = { Class owner, String methodName ->
            try {
                // Every overload, since the interesting one may not be the first found.
                def methods = owner.methods.findAll { it.name == methodName }
                if (methods.isEmpty()) {
                    println ""
                    println "  <${owner.simpleName} has no ${methodName}>"
                    return null
                }

                def seen = [] as Set
                methods.each { method ->
                    if (method.returnType != void.class && !method.returnType.isPrimitive()
                            && seen.add(method.returnType)) {
                        dump(method.returnType, [], "  <- returned by ${owner.simpleName}#${methodName}")
                    }
                    method.parameterTypes.each { param ->
                        if (!param.isPrimitive() && seen.add(param)) {
                            dump(param, [], "  <- parameter of ${owner.simpleName}#${methodName}")
                        }
                    }
                }
                return methods.first()
            } catch (Throwable failure) {
                println "  <could not follow ${methodName}: ${failure}>"
                return null
            }
        }

        [
                { ->
                    def source = load('net.minecraft.server.command.ServerCommandSource')
                    if (source != null) {
                        dump(source, ['permission', 'player', 'entity', 'server'], '')
                        def permissions = follow(source, 'getPermissions')
                        if (permissions != null) follow(permissions.returnType, 'hasPermission')
                    }
                },
                { ->
                    def commandManager = load('net.minecraft.server.command.CommandManager')
                    if (commandManager != null) {
                        dump(commandManager, ['permission', 'require', 'level'], '')
                        follow(commandManager, 'requirePermissionLevel')
                    }
                },
                { ->
                    def playerManager = load('net.minecraft.server.PlayerManager')
                    if (playerManager != null) {
                        dump(playerManager, ['operator', 'permission', 'op'], '')
                        follow(playerManager, 'isOperator')
                    }
                },
                { ->
                    def player = load('net.minecraft.server.network.ServerPlayerEntity')
                    if (player != null) dump(player, ['config', 'profile', 'permission', 'operator'], '')
                },
                { ->
                    def server = load('net.minecraft.server.MinecraftServer')
                    if (server != null) dump(server, ['operator', 'permission', 'playermanager', 'host'], '')
                },
                { ->
                    // Everything the keys screen touches. KeyBinding and the input events
                    // were both reworked in this version, so these are dumped whole rather
                    // than filtered: the names that replaced setKeyCode and
                    // getTranslationKey cannot be searched for without knowing them.
                    def binding = load('net.minecraft.client.option.KeyBinding')
                    if (binding != null) dump(binding, [], '  <- the whole thing, on purpose')

                    def options = load('net.minecraft.client.option.GameOptions')
                    if (options != null) dump(options, ['key', 'write', 'save', 'bind'], '')

                    def input = load('net.minecraft.client.util.InputUtil')
                    if (input != null) dump(input, ['key', 'code', 'type', 'unknown'], '')

                    // The two signatures that moved. Following them dumps whatever a key
                    // press and a click now arrive as, which is what the overrides need.
                    def screen = load('net.minecraft.client.gui.screen.Screen')
                    if (screen != null) {
                        dump(screen, ['key', 'mouse', 'click', 'char'], '')
                        follow(screen, 'keyPressed')
                        follow(screen, 'mouseClicked')
                    }
                },
                { ->
                    // Client-side surfaces used by the fake-items GUI.
                    [
                            'net.minecraft.client.MinecraftClient'          : ['screen', 'execute', 'player', 'crosshair'],
                            'net.minecraft.client.network.ClientPlayerEntity': ['inventory'],
                            'net.minecraft.entity.player.PlayerInventory'   : ['stack'],
                            'net.minecraft.registry.Registries'             : ['item'],
                            'net.minecraft.registry.Registry'               : ['get'],
                            'net.minecraft.client.gui.screen.Screen'        : ['init', 'render', 'drawable', 'close', 'pause'],
                            'net.minecraft.client.gui.DrawContext'          : ['text', 'item'],
                            'net.minecraft.client.gui.widget.ButtonWidget'  : ['build', 'dimension', 'message'],
                            'net.minecraft.client.gui.widget.TextFieldWidget': ['text', 'placeholder', 'max'],
                            'net.minecraft.component.DataComponentTypes'    : ['lore', 'name', 'glint'],
                            'net.minecraft.component.type.LoreComponent'    : [],
                            'net.minecraft.component.type.MapIdComponent'   : [],
                            'net.minecraft.text.Style'                      : ['italic', 'empty'],
                            'net.minecraft.item.ItemStack'                  : ['set', 'count', 'name'],
                            'net.minecraft.screen.slot.Slot'                : ['stack'],
                            'net.minecraft.client.world.ClientWorld'        : ['addentity', 'chunk', 'random'],
                            'net.minecraft.block.BlockState'                : ['codec', 'isair',
                                                                               'block', 'breaking',
                                                                               'soundgroup'],
                            'net.minecraft.sound.BlockSoundGroup'           : [],
                            'net.minecraft.client.particle.ParticleManager' : [],
                            'net.minecraft.client.option.GameOptions'       : ['attack', 'use'],
                            'net.fabricmc.fabric.api.event.player.UseBlockCallback': [],
                            'net.fabricmc.fabric.api.event.player.AttackBlockCallback': [],
                            'net.minecraft.world.World'                     : ['redstone', 'power',
                                                                               'particle', 'break',
                                                                               'setblockstate',
                                                                               'blockstate', 'chunk'],
                            'net.minecraft.entity.Entity'                   : ['pos', 'refresh',
                                                                               'noclip', 'gravity',
                                                                               'getx', 'gety',
                                                                               'getz', 'velocity', 'setid',
                                                                               'discard', 'raycast',
                                                                               'playsound', 'distance'],
                            'net.minecraft.entity.ItemEntity'               : ['pickup', 'stack'],
                            'net.minecraft.entity.projectile.ArrowEntity'   : [],
                            'net.minecraft.entity.decoration.ItemFrameEntity': [],
                            'net.minecraft.entity.decoration.ArmorStandEntity': ['equip', 'slot'],
                            'net.minecraft.entity.EquipmentSlot'            : [],
                            'net.minecraft.client.gui.screen.Screen'        : ['shift', 'width',
                                                                               'height'],
                            'net.minecraft.client.gui.screen.ingame.HandledScreen': ['handler',
                                                                               'slot', 'x', 'y'],
                            'net.minecraft.screen.ScreenHandler'            : ['slot', 'cursor',
                                                                               'revision'],
                            'net.fabricmc.fabric.api.client.screen.v1.ScreenEvents': [],
                            'net.fabricmc.fabric.api.client.screen.v1.ScreenMouseEvents': [],
                            'net.minecraft.client.Mouse'                    : ['getx', 'gety'],
                            'net.minecraft.client.util.Window'              : ['handle', 'scaled',
                                                                               'width', 'height'],
                            'net.minecraft.client.option.KeyBinding'        : [],
                            'net.minecraft.client.option.KeyBinding$Category': [],
                            'net.minecraft.client.util.InputUtil'           : ['keysym', 'type'],
                            'net.minecraft.util.math.MathHelper'            : ['lerp', 'atan2'],
                            'net.minecraft.util.hit.BlockHitResult'         : ['pos', 'side'],
                            'net.minecraft.client.gui.widget.ClickableWidget': ['visible', 'active', 'getx', 'gety'],
                    ].each { className, filters ->
                        def type = load(className)
                        if (type != null) dump(type, filters, '')
                    }
                },
        ].each { section ->
            try {
                section()
            } catch (Throwable failure) {
                println ""
                println "  <section failed: ${failure}>"
            }
        }

        println ""
    }
}

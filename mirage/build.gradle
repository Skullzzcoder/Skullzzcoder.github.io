plugins {
    // Newest stable Loom. Older Loom (1.11) fails during Minecraft setup against a recent
    // Fabric API with "Javadoc provided by mod (...) must be have an intermediary source
    // namespace"; a dynamic range picks up 1.18.0-alpha builds, which we do not want.
    // This Loom declares org.gradle.plugin.api-version 9.5.0, so the wrapper must be
    // Gradle 9.5 or newer -- see gradle/wrapper/gradle-wrapper.properties.
    id 'fabric-loom' version '1.17.20'
    id 'maven-publish'
}

// The four toolchain versions live in gradle.properties. Read them defensively so a
// missing one names itself instead of surfacing as Gradle's "unknown property".
// Run fabric-versions.ps1 to fill them in for your Minecraft version.
def versionProps = ['minecraft_version', 'yarn_mappings', 'loader_version', 'fabric_version']
def prop = { String name -> project.findProperty(name) ?: 'MISSING' }

def missing = versionProps.findAll { !project.hasProperty(it) }
if (!missing.isEmpty()) {
    throw new GradleException(
            "gradle.properties is missing: ${missing.join(', ')}\n\n" +
            "Get the correct values for your Minecraft version with:\n" +
            "    powershell -ExecutionPolicy Bypass -File fabric-versions.ps1 -Write\n" +
            "or by hand from https://fabricmc.net/develop/")
}

version = project.findProperty('mod_version') ?: '1.0.0'
group = project.findProperty('maven_group') ?: 'dev.skullzz'

base {
    archivesName = project.findProperty('archives_base_name') ?: 'mirage'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${prop('minecraft_version')}"
    mappings "net.fabricmc:yarn:${prop('yarn_mappings')}:v2"
    modImplementation "net.fabricmc:fabric-loader:${prop('loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${prop('fabric_version')}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Compile target. 21 keeps the jar loadable on any Java 21+ server; raise it only if
// compilation complains that Minecraft's class files are a newer version than this.
def javaVersion = Integer.parseInt((project.findProperty('java_version') ?: '21').toString())

// options.release alone pins both source and target, and unlike the java extension's
// sourceCompatibility/targetCompatibility it is not deprecated under Gradle 9.
tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

/**
 * Prints the real members of the Minecraft classes this mod leans on, read straight off the
 * remapped compile classpath. Run this when a "cannot find symbol" error means a yarn name
 * moved between versions: gradlew inspectApi
 */
tasks.register('inspectApi') {
    group = 'help'
    description = 'Prints members of the Minecraft classes this mod depends on.'
    notCompatibleWithConfigurationCache('Loads classes from the compile classpath.')

    def compileClasspath = sourceSets.main.compileClasspath

    doLast {
        def urls = compileClasspath.files.collect { it.toURI().toURL() }
        def loader = new URLClassLoader(urls as URL[], (ClassLoader) null)

        // Printing a member resolves the classes in its signature, and some Minecraft
        // classes fail JVM verification when loaded outside the game. So keep filters
        // narrow, and let a single unprintable member be skipped rather than aborting.
        def dump = { Class type, List filters, String note ->
            println ""
            println "== ${type.name}${note}"
            def lines = [] as TreeSet
            def skipped = 0

            try {
                type.methods.each { method ->
                    try {
                        if (method.declaringClass == Object.class) return
                        if (filters.isEmpty() || filters.any { method.name.toLowerCase().contains(it) }) {
                            def params = method.parameterTypes.collect { it.simpleName }.join(', ')
                            lines << "  ${method.returnType.simpleName} ${method.name}(${params})"
                        }
                    } catch (Throwable ignored) {
                        skipped++
                    }
                }
                type.fields.each { field ->
                    try {
                        if (filters.isEmpty() || filters.any { field.name.toLowerCase().contains(it) }) {
                            lines << "  [field] ${field.type.simpleName} ${field.name}"
                        }
                    } catch (Throwable ignored) {
                        skipped++
                    }
                }
            } catch (Throwable failure) {
                println "  <member listing failed: ${failure}>"
            }

            if (lines.isEmpty()) {
                println "  <nothing matched the filters ${filters}>"
            } else {
                lines.each { println it }
            }
            if (skipped > 0) println "  (${skipped} member(s) skipped: signature classes would not load)"
        }

        def load = { String name ->
            try {
                return loader.loadClass(name)
            } catch (Throwable failure) {
                println ""
                println "== ${name}"
                println "  <could not load: ${failure}>"
                return null
            }
        }

        def source = load('net.minecraft.server.command.ServerCommandSource')
        if (source != null) {
            dump(source, ['permission', 'player', 'entity', 'server'], '')

            // Follow the type getPermissions() hands back, whatever it is called, so the
            // real permission check can be read off without knowing its package.
            try {
                def permissions = source.methods.find { it.name == 'getPermissions' }
                if (permissions != null) {
                    def type = permissions.returnType
                    println ""
                    println "   (ServerCommandSource#getPermissions returns ${type.name})"
                    dump(type, [], '  <- the permission API')
                }
            } catch (Throwable failure) {
                println "  <could not follow getPermissions: ${failure}>"
            }
        }

        def commandManager = load('net.minecraft.server.command.CommandManager')
        if (commandManager != null) {
            dump(commandManager, ['permission', 'require', 'level'], '')
        }

        println ""
    }
}

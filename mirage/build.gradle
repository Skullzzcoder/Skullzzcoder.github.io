plugins {
    // Newest stable Loom. Older Loom (1.11) fails during Minecraft setup against a recent
    // Fabric API with "Javadoc provided by mod (...) must be have an intermediary source
    // namespace"; a dynamic range picks up 1.18.0-alpha builds, which we do not want.
    // This Loom declares org.gradle.plugin.api-version 9.5.0, so the wrapper must be
    // Gradle 9.5 or newer -- see gradle/wrapper/gradle-wrapper.properties.
    id 'fabric-loom' version '1.17.20'
    id 'maven-publish'
}

// The four toolchain versions live in gradle.properties. Read them defensively so a
// missing one names itself instead of surfacing as Gradle's "unknown property".
// Run fabric-versions.ps1 to fill them in for your Minecraft version.
def versionProps = ['minecraft_version', 'yarn_mappings', 'loader_version', 'fabric_version']
def prop = { String name -> project.findProperty(name) ?: 'MISSING' }

def missing = versionProps.findAll { !project.hasProperty(it) }
if (!missing.isEmpty()) {
    throw new GradleException(
            "gradle.properties is missing: ${missing.join(', ')}\n\n" +
            "Get the correct values for your Minecraft version with:\n" +
            "    powershell -ExecutionPolicy Bypass -File fabric-versions.ps1 -Write\n" +
            "or by hand from https://fabricmc.net/develop/")
}

version = project.findProperty('mod_version') ?: '1.0.0'
group = project.findProperty('maven_group') ?: 'dev.skullzz'

base {
    archivesName = project.findProperty('archives_base_name') ?: 'mirage'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${prop('minecraft_version')}"
    mappings "net.fabricmc:yarn:${prop('yarn_mappings')}:v2"
    modImplementation "net.fabricmc:fabric-loader:${prop('loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${prop('fabric_version')}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Compile target. 21 keeps the jar loadable on any Java 21+ server; raise it only if
// compilation complains that Minecraft's class files are a newer version than this.
def javaVersion = Integer.parseInt((project.findProperty('java_version') ?: '21').toString())

// options.release alone pins both source and target, and unlike the java extension's
// sourceCompatibility/targetCompatibility it is not deprecated under Gradle 9.
tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.compilerArgs << '-Xlint:deprecation'
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

/**
 * Prints the real members of the Minecraft classes this mod leans on, read straight off the
 * remapped compile classpath. Run this when a "cannot find symbol" error means a yarn name
 * moved between versions: gradlew inspectApi
 */
tasks.register('inspectApi') {
    group = 'help'
    description = 'Prints members of the Minecraft classes this mod depends on.'
    notCompatibleWithConfigurationCache('Loads classes from the compile classpath.')

    def compileClasspath = sourceSets.main.compileClasspath

    doLast {
        def urls = compileClasspath.files.collect { it.toURI().toURL() }
        def loader = new URLClassLoader(urls as URL[], (ClassLoader) null)

        // Printing a member resolves the classes in its signature, and some Minecraft
        // classes fail JVM verification when loaded outside the game. So keep filters
        // narrow, and let a single unprintable member be skipped rather than aborting.
        def dump
        dump = { Class type, List filters, String note ->
          // Blanket guard: reading any member can trigger loading a class that fails
          // verification, and this is a diagnostic tool -- it must never fail the build.
          try {
            println ""
            println "== ${type.name}${note}"
            def lines = [] as TreeSet
            def skipped = 0

            try {
                type.methods.each { method ->
                    try {
                        if (method.declaringClass == Object.class) return
                        if (filters.isEmpty() || filters.any { method.name.toLowerCase().contains(it) }) {
                            def params = method.parameterTypes.collect { it.simpleName }.join(', ')
                            lines << "  ${method.returnType.simpleName} ${method.name}(${params})"
                        }
                    } catch (Throwable ignored) {
                        skipped++
                    }
                }
                type.fields.each { field ->
                    try {
                        if (filters.isEmpty() || filters.any { field.name.toLowerCase().contains(it) }) {
                            lines << "  [field] ${field.type.simpleName} ${field.name}"
                        }
                    } catch (Throwable ignored) {
                        skipped++
                    }
                }
                // Constructors have no name to filter on, so only list them on a full dump.
                if (filters.isEmpty()) {
                    type.constructors.each { constructor ->
                        try {
                            def params = constructor.parameterTypes.collect { it.simpleName }.join(', ')
                            lines << "  [ctor] ${type.simpleName}(${params})"
                        } catch (Throwable ignored) {
                            skipped++
                        }
                    }
                }
            } catch (Throwable failure) {
                println "  <member listing failed: ${failure}>"
            }

            if (lines.isEmpty()) {
                println "  <nothing matched the filters ${filters}>"
            } else {
                lines.each { println it }
            }
            if (skipped > 0) println "  (${skipped} member(s) skipped: signature classes would not load)"
          } catch (Throwable failure) {
            println "  <could not inspect ${type}: ${failure}>"
          }
        }

        def load = { String name ->
            try {
                return loader.loadClass(name)
            } catch (Throwable failure) {
                println ""
                println "== ${name}"
                println "  <could not load: ${failure}>"
                return null
            }
        }

        // Dump whatever types a method mentions, so an unfamiliar API can be explored
        // without having to know which package its classes live in.
        def follow
        follow = { Class owner, String methodName ->
            try {
                // Every overload, since the interesting one may not be the first found.
                def methods = owner.methods.findAll { it.name == methodName }
                if (methods.isEmpty()) {
                    println ""
                    println "  <${owner.simpleName} has no ${methodName}>"
                    return null
                }

                def seen = [] as Set
                methods.each { method ->
                    if (method.returnType != void.class && !method.returnType.isPrimitive()
                            && seen.add(method.returnType)) {
                        dump(method.returnType, [], "  <- returned by ${owner.simpleName}#${methodName}")
                    }
                    method.parameterTypes.each { param ->
                        if (!param.isPrimitive() && seen.add(param)) {
                            dump(param, [], "  <- parameter of ${owner.simpleName}#${methodName}")
                        }
                    }
                }
                return methods.first()
            } catch (Throwable failure) {
                println "  <could not follow ${methodName}: ${failure}>"
                return null
            }
        }

        [
                { ->
                    def source = load('net.minecraft.server.command.ServerCommandSource')
                    if (source != null) {
                        dump(source, ['permission', 'player', 'entity', 'server'], '')
                        def permissions = follow(source, 'getPermissions')
                        if (permissions != null) follow(permissions.returnType, 'hasPermission')
                    }
                },
                { ->
                    def commandManager = load('net.minecraft.server.command.CommandManager')
                    if (commandManager != null) {
                        dump(commandManager, ['permission', 'require', 'level'], '')
                        follow(commandManager, 'requirePermissionLevel')
                    }
                },
                { ->
                    def playerManager = load('net.minecraft.server.PlayerManager')
                    if (playerManager != null) {
                        dump(playerManager, ['operator', 'permission', 'op'], '')
                        follow(playerManager, 'isOperator')
                    }
                },
                { ->
                    def player = load('net.minecraft.server.network.ServerPlayerEntity')
                    if (player != null) dump(player, ['config', 'profile', 'permission', 'operator'], '')
                },
                { ->
                    def server = load('net.minecraft.server.MinecraftServer')
                    if (server != null) dump(server, ['operator', 'permission', 'playermanager', 'host'], '')
                },
                { ->
                    // Client-side surfaces used by the fake-items GUI.
                    [
                            'net.minecraft.client.MinecraftClient'          : ['screen', 'execute', 'player', 'crosshair'],
                            'net.minecraft.client.network.ClientPlayerEntity': ['inventory'],
                            'net.minecraft.entity.player.PlayerInventory'   : ['stack'],
                            'net.minecraft.registry.Registries'             : ['item'],
                            'net.minecraft.registry.Registry'               : ['get'],
                            'net.minecraft.client.gui.screen.Screen'        : ['init', 'render', 'drawable', 'close', 'pause'],
                            'net.minecraft.client.gui.DrawContext'          : ['text', 'item'],
                            'net.minecraft.client.gui.widget.ButtonWidget'  : ['build', 'dimension', 'message'],
                            'net.minecraft.client.gui.widget.TextFieldWidget': ['text', 'placeholder', 'max'],
                            'net.minecraft.component.DataComponentTypes'    : ['lore', 'name', 'glint'],
                            'net.minecraft.component.type.LoreComponent'    : [],
                            'net.minecraft.text.Style'                      : ['italic', 'empty'],
                            'net.minecraft.item.ItemStack'                  : ['set', 'count', 'name'],
                            'net.minecraft.screen.slot.Slot'                : ['stack'],
                            'net.minecraft.client.world.ClientWorld'        : ['addentity', 'chunk', 'random'],
                            'net.minecraft.entity.projectile.ArrowEntity'   : [],
                            'net.minecraft.client.option.KeyBinding'        : [],
                            'net.minecraft.client.option.KeyBinding$Category': [],
                            'net.minecraft.client.util.InputUtil'           : ['keysym', 'type'],
                            'net.minecraft.util.math.MathHelper'            : ['lerp', 'atan2'],
                            'net.minecraft.util.hit.BlockHitResult'         : ['pos', 'side'],
                            'net.minecraft.client.gui.widget.ClickableWidget': ['visible', 'active', 'getx', 'gety'],
                    ].each { className, filters ->
                        def type = load(className)
                        if (type != null) dump(type, filters, '')
                    }
                },
        ].each { section ->
            try {
                section()
            } catch (Throwable failure) {
                println ""
                println "  <section failed: ${failure}>"
            }
        }

        println ""
    }
}

# Toolchain for Minecraft 26.2, looked up from Fabric's API on 2026-09-04.
# Build with: gradlew build -Ptarget=26.2

# INCOMPLETE. A blank value below was not found and has to be filled in by hand from
# https://fabricmc.net/develop/ -- Gradle will name the blank one rather than failing
# somewhere confusing later. Re-run with -YarnMappings <version> to fill yarn in.
minecraft_version=26.2
yarn_mappings=
loader_version=0.19.5
fabric_version=0.159.0+26.2

# What the built jar tells Fabric it runs on. Exactly the version it was compiled against:
# a Fabric mod is built against remapped Minecraft names, and those names move between
# releases, so widening this does not make the jar work on another version -- it only
# stops Fabric from warning you before it breaks.
minecraft_depend=~26.2

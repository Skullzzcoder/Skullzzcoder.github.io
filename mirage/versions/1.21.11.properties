# Toolchain for Minecraft 1.21.11. Verified against Fabric's API.
# Regenerate for another version with:
#   powershell -ExecutionPolicy Bypass -File fabric-versions.ps1 -MinecraftVersion <mc> -Write
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
fabric_version=0.141.6+1.21.11

# What the built jar tells Fabric it runs on. One built jar, one Minecraft version:
# these are the versions whose names this jar was compiled against, not a wish.
minecraft_depend=~1.21.11

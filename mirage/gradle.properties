org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ---------------------------------------------------------------------------
# Verified against Fabric's and Modrinth's APIs for Minecraft 1.21.11.
#
# Targeting a different Minecraft version? Regenerate these with:
#   powershell -ExecutionPolicy Bypass -File fabric-versions.ps1 -Write
# or copy them from https://fabricmc.net/develop/
#
# Loom resolves these while Gradle is still configuring the project, so if one
# is wrong the build stops before any Gradle task can run.
# ---------------------------------------------------------------------------
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
fabric_version=0.141.6+1.21.11

# Bytecode level for the mod jar. 21 loads on any Java 21+ server. Raise it only if the
# compiler reports that Minecraft's class files are newer than this.
java_version=21

# Loom 1.17.20 runs fine on JDK 21, so no special JDK is needed. To build with a different
# JDK anyway, uncomment and correct this (doubled backslashes are required here):
# org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-21.0.12.101-hotspot

# How the mod shows up in the mod list. Change these to whatever you want it called --
# they are the only two lines that decide it, and no code has to be touched.
mod_name=Ryne Client
mod_description=Client-side visual mod. Paints builds, Litematica schematics and map art into your own copy of the world, and can rig what your dispensers appear to produce. Everything is on your screen only - nothing is sent to the server and nobody else sees any of it.

mod_version=1.0.0
maven_group=dev.skullzz
archives_base_name=mirage

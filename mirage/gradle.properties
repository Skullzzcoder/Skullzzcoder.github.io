org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ---------------------------------------------------------------------------
# IMPORTANT: these four values are PLACEHOLDERS. Fix them before building.
#
#   powershell -ExecutionPolicy Bypass -File fabric-versions.ps1 -Write
#
# or copy them by hand from https://fabricmc.net/develop/ (pick 1.21.11).
#
# A wrong value fails the build with "Could not find <artifact>", naming the
# one that is wrong. Loom resolves these while Gradle is still configuring
# the project, so no Gradle task can run until they are right.
# ---------------------------------------------------------------------------
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.17.2
fabric_version=0.135.0+1.21.11

mod_version=1.0.0
maven_group=dev.skullzz
archives_base_name=mirage

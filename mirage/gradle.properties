org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ---------------------------------------------------------------------------
# Verified against Fabric's and Modrinth's APIs for Minecraft 1.21.11.
#
# Targeting a different Minecraft version? Regenerate these with:
#   powershell -ExecutionPolicy Bypass -File fabric-versions.ps1 -Write
# or copy them from https://fabricmc.net/develop/
#
# Loom resolves these while Gradle is still configuring the project, so if one
# is wrong the build stops before any Gradle task can run.
# ---------------------------------------------------------------------------
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
fabric_version=0.141.6+1.21.11

# Minecraft 1.21.11 targets Java 25. Set to 21 only if you retarget older Minecraft.
java_version=25

# Gradle itself must run on JDK 25 for this Loom. If JAVA_HOME points at an older JDK,
# uncomment and correct this instead of changing JAVA_HOME globally (note the doubled
# backslashes -- required in a .properties file):
# org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-25.0.1.9-hotspot

mod_version=1.0.0
maven_group=dev.skullzz
archives_base_name=mirage

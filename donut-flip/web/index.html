<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DonutSMP Order-Flip Tracker</title>
<style>
  :root{
    --bg:#12100c; --panel:#1c1810; --panel2:#231e14; --line:#33291a;
    --text:#f0e4c8; --muted:#9a8a68; --accent:#e0a63a; --good:#5fce7a;
    --warn:#e0b13a; --bad:#e07a5f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,'Segoe UI',sans-serif;padding:24px}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:6px}
  h1{font-size:22px;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  input,select,button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:7px 10px;font:inherit;font-size:13px}
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .card .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .card .v{font-size:20px;font-weight:700;margin-top:2px}
  .wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  table{border-collapse:collapse;width:100%;min-width:900px}
  th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  th{background:var(--panel2);color:var(--muted);font-size:11px;text-transform:uppercase;
    letter-spacing:.6px;cursor:pointer;position:sticky;top:0}
  th:hover{color:var(--accent)}
  tbody tr:hover{background:#241e13}
  .item{font-weight:600}
  .num{font-variant-numeric:tabular-nums}
  .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)} .muted{color:var(--muted)}
  .flags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .flag{background:#2e2415;border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:1px 7px;font-size:10.5px}
  .flag.hot{border-color:#5a3a2a;color:var(--bad)}
  .plan{margin-top:22px}
  .plan h2,.tbl h2{font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 8px}
  .note{margin-top:20px;color:var(--muted);font-size:12px;line-height:1.7;max-width:70ch}
  .err{background:#2a1712;border:1px solid #5a3a2a;color:var(--bad);padding:12px;border-radius:8px}
</style>
</head>
<body>
<header>
  <h1>Donut<span>SMP</span> Order-Flip Tracker</h1>
  <span class="muted" id="stamp"></span>
</header>
<p class="sub">Buy on <code>/order</code>, resell on <code>/ah</code>. Ranked by profit per hour weighted by confidence &mdash; not by raw spread.</p>

<div class="bar">
  <input id="q" type="search" placeholder="Filter items…" />
  <label class="muted">Min ROI <input id="roi" type="number" value="0" min="0" step="5" style="width:70px" />%</label>
  <label class="muted">Min conf <input id="conf" type="number" value="0" min="0" max="1" step="0.05" style="width:70px" /></label>
  <label class="muted"><input id="safe" type="checkbox" /> Hide flagged</label>
  <button id="refresh">Refresh</button>
</div>

<div class="cards" id="cards"></div>
<div id="error"></div>

<div class="tbl">
  <h2>Opportunities</h2>
  <div class="wrap">
    <table>
      <thead><tr>
        <th data-k="label">Item</th>
        <th data-k="basis">Basis</th>
        <th data-k="buyPrice">Bid ≤</th>
        <th data-k="expectedSellPrice">List at</th>
        <th data-k="unitProfit">Profit/unit</th>
        <th data-k="roiPct">ROI</th>
        <th data-k="velocityPerHour">Sold/h</th>
        <th data-k="profitPerHour">Profit/h</th>
        <th data-k="confidence">Conf</th>
        <th data-k="risks">Flags</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div class="plan" id="plan"></div>

<p class="note" id="note"></p>

<script>
const SHORT = {thin_sale_history:'thin history',no_recent_sales:'no sales',volatile_prices:'volatile',
  one_seller_dominates:'one seller',suspicious_low_listing:'bait listing',almost_no_listings:'few listings',
  price_falling:'falling',enchanted_variant:'enchanted',contents_priced:'contents',bid_not_observed:'no order book',
  oversupplied:'oversupplied'};
const HOT = new Set(['no_recent_sales','one_seller_dominates','price_falling','volatile_prices','thin_sale_history']);

const coins = n => {
  if (n == null || !isFinite(n)) return '—';
  const a = Math.abs(n), s = n < 0 ? '-' : '';
  if (a >= 1e12) return s + (a/1e12).toFixed(2) + 't';
  if (a >= 1e9) return s + (a/1e9).toFixed(2) + 'b';
  if (a >= 1e6) return s + (a/1e6).toFixed(2) + 'm';
  if (a >= 1e3) return s + (a/1e3).toFixed(1) + 'k';
  return s + Math.round(a);
};

let data = null, sortKey = 'score', sortDir = -1;

async function load() {
  const err = document.getElementById('error');
  err.innerHTML = '';
  for (const url of ['/api/opportunities', './opportunities.json', './data/opportunities.json']) {
    try {
      const res = await fetch(url, {cache: 'no-store'});
      if (!res.ok) continue;
      data = await res.json();
      render();
      return;
    } catch (e) { /* try the next source */ }
  }
  err.innerHTML = '<div class="err">No scan data found. Run <code>donut-flip serve</code>, ' +
    'or place an <code>opportunities.json</code> (written by <code>donut-flip scan</code>) next to this page.</div>';
}

function visible() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const minRoi = Number(document.getElementById('roi').value) || 0;
  const minConf = Number(document.getElementById('conf').value) || 0;
  const safe = document.getElementById('safe').checked;
  return (data.opportunities || []).filter(o =>
    (!q || o.label.toLowerCase().includes(q) || o.key.toLowerCase().includes(q)) &&
    o.roiPct >= minRoi && o.confidence >= minConf &&
    (!safe || !o.risks.some(r => HOT.has(r)))
  ).sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (typeof x === 'string') return sortDir * x.localeCompare(y);
    return sortDir * ((x ?? 0) - (y ?? 0));
  });
}

function render() {
  const rows = visible();
  document.getElementById('stamp').textContent =
    'scanned ' + new Date(data.generatedAt).toLocaleString();

  const totalPerHour = rows.reduce((s, o) => s + (o.profitPerHour || 0), 0);
  const best = rows[0];
  document.getElementById('cards').innerHTML = [
    ['Opportunities', rows.length],
    ['Best flip', best ? best.label.split(' (')[0] : '—'],
    ['Top profit/h', coins(best ? best.profitPerHour : 0)],
    ['Combined profit/h', coins(totalPerHour)],
    ['Order book', data.orderBook && data.orderBook.present ? 'observed bids' : 'derived max bid'],
  ].map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

  document.getElementById('rows').innerHTML = rows.map(o => {
    const cls = o.confidence >= 0.6 ? 'good' : o.confidence >= 0.35 ? 'warn' : 'bad';
    return `<tr>
      <td class="item">${o.label}</td>
      <td class="muted">${o.basis === 'observed_order' ? 'order book' : 'advisory'}</td>
      <td class="num">${coins(o.buyPrice)}</td>
      <td class="num">${coins(o.expectedSellPrice)}</td>
      <td class="num good">${coins(o.unitProfit)}</td>
      <td class="num">${o.roiPct.toFixed(1)}%</td>
      <td class="num">${o.velocityPerHour.toFixed(1)}</td>
      <td class="num good">${coins(o.profitPerHour)}</td>
      <td class="num ${cls}">${o.confidence.toFixed(2)}</td>
      <td><div class="flags">${o.risks.map(r =>
        `<span class="flag ${HOT.has(r) ? 'hot' : ''}">${SHORT[r] || r}</span>`).join('')}</div></td>
    </tr>`;
  }).join('') || '<tr><td colspan="10" class="muted">Nothing matches these filters.</td></tr>';

  const plan = data.plan || [];
  document.getElementById('plan').innerHTML = plan.length ? `<h2>Suggested allocation${
    data.budget ? ' of ' + coins(data.budget) : ''}</h2><div class="wrap"><table>
    <thead><tr><th>Item</th><th>Units</th><th>Bid at</th><th>Outlay</th><th>List at</th><th>Expected profit</th><th>Turnover</th></tr></thead>
    <tbody>${plan.map(p => `<tr><td class="item">${p.label}</td><td class="num">${p.units}</td>
      <td class="num">${coins(p.bidAt)}</td><td class="num">${coins(p.outlay)}</td>
      <td class="num">${coins(p.listAt)}</td><td class="num good">${coins(p.expectedProfit)}</td>
      <td class="num muted">~${p.expectedHours}h</td></tr>`).join('')}</tbody></table></div>` : '';

  const a = data.assumptions || {};
  document.getElementById('note').innerHTML =
    `Assumptions: ${((a.ahTaxPct ?? 0) * 100).toFixed(0)}% AH tax on sale, ` +
    `${((a.undercutPct ?? 0) * 100).toFixed(0)}% undercut to sell promptly, ` +
    `${((a.captureShare ?? 0) * 100).toFixed(0)}% of observed flow captured, ` +
    `${a.targetRoiPct ?? 0}% target ROI for advisory bids. ` +
    `Prices are per single unit. Sale history window ${data.lookbackHours ?? 24}h. ` +
    `Confidence blends sample size, price stability, listing depth, freshness and seller concentration; ` +
    `treat anything under 0.35 as a guess.`;
}

for (const id of ['q', 'roi', 'conf', 'safe']) {
  document.getElementById(id).addEventListener('input', () => data && render());
}
document.getElementById('refresh').addEventListener('click', load);
document.querySelectorAll('th[data-k]').forEach(th => th.addEventListener('click', () => {
  const k = th.dataset.k;
  sortDir = sortKey === k ? -sortDir : -1;
  sortKey = k;
  render();
}));
load();
</script>
</body>
</html>

plugins {
	id 'fabric-loom' version '1.13.3'
	id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

/*
 * Yarn's build number is assigned by Fabric's CI, so it cannot be derived from
 * anything in this repo. Ask the Fabric meta API for the newest build of the
 * mappings for our Minecraft version, and fall back to the pinned value if the
 * network is unavailable (offline builds, CI without egress).
 */
def resolveYarnMappings = {
	def fallback = project.yarn_mappings_fallback

	try {
		def endpoint = "https://meta.fabricmc.net/v2/versions/yarn/${project.minecraft_version}"
		def builds = new groovy.json.JsonSlurper().parse(
				new URL(endpoint).newInputStream(connectTimeout: 5000, readTimeout: 5000))

		if (builds) {
			return builds.first().version
		}

		logger.lifecycle("Fabric meta knows no yarn builds for ${project.minecraft_version}, using ${fallback}")
	} catch (Exception e) {
		logger.lifecycle("Could not reach Fabric meta (${e.message}), using pinned yarn ${fallback}")
	}

	return fallback
}

def yarnMappings = resolveYarnMappings()
logger.lifecycle("Glaze: building against yarn ${yarnMappings}")

repositories {
	maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${yarnMappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', project.minecraft_version
	inputs.property 'loader_version', project.loader_version

	filesMatching('fabric.mod.json') {
		expand([
				version          : project.version,
				minecraft_version: project.minecraft_version,
				loader_version   : project.loader_version
		])
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

test {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

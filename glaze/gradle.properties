org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Fabric toolchain.
# These are the versions FabricMC itself pins on the 1.21.11 branch.
minecraft_version=1.21.11
loader_version=0.17.3
fabric_version=0.141.6+1.21.11

# Yarn mappings are published as "<mc>+build.<n>" where <n> comes from Fabric's CI.
# build.gradle asks meta.fabricmc.net for the newest build at configure time and
# falls back to this pin when offline. If you ever need to hard-pin, look the
# current value up at https://fabricmc.net/develop/ and set it here.
yarn_mappings_fallback=1.21.11+build.1

mod_version=0.1.0
maven_group=com.skullzz
archives_base_name=glaze
